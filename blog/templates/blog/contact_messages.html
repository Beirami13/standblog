{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h2>Contact Messages</h2>

    {% for message in messages %}

        <div class="message">

            <h4>{{ message.subject }}</h4>

            <p>
                <strong>Name:</strong>
                {{ message.name }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ message.email }}
            </p>

            <p>
                {{ message.message }}
            </p>

            <small>
                {{ message.created_at }}
            </small>

        </div>

        <hr>

    {% empty %}

        <p>No messages yet.</p>

    {% endfor %}

</div>

{% endblock %}
